name: Debian Compile and Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    container:
      image: debian:stable

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libssl-dev \
          libplist-dev \
          libavahi-compat-libdnssd-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libx11-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Compile project
      run: |
        cd build
        make

    # 💡 CHANGED: Removed the 'if' guard so it executes on every single push/manual run
    - name: Upload Binary to Releases
      uses: softprops/action-gh-release@v2
      with:
        files: build/uxplay
        tag_name: latest
        name: "Latest Dev Build"
        body: "Automated compilation tracking the latest changes. Compiled on Debian Stable."
        prerelease: true # Marks it as a pre-release so users know it's an automated build
        allowUpdates: true # Overwrites the binary file inside the 'latest' release tag on every push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
