name: Debian Compile and Release

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.73.7)'
        required: true
        default: 'manual-build'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:stable

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libssl-dev \
          libplist-dev \
          libavahi-compat-libdnssd-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libx11-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Compile project
      run: |
        cd build
        make

    # Uploads if it's a real Git tag OR if triggered manually via UI
    - name: Upload Binary to Releases
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: build/uxplay
        tag_name: ${{ github.ref_name || github.event.inputs.version }}
        name: Release ${{ github.ref_name || github.event.inputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
